<script>
  (function () {
    var DIAG_35MM = Math.sqrt(36 * 36 + 24 * 24);
    var currentLang = "ja";
    var notesOpen = false;
    var hasCalculated = false;

    var uiText = {
      ja: {
        title: "ピンホールカメラ計算機",
        subtitle: "画角・焦点距離・ピンホール径・35mm換算をまとめて設計",
        legendCommon: "共通パラメータ",
        legendMode: "計算モード",
        width: "フィルム／印画紙 横幅 W（mm）",
        height: "フィルム／印画紙 縦幅 H（mm）",
        lambda: "光の波長 λ（nm）",

        modeFovTitle: "画角から設計",
        modeFovDesc: "欲しい画角（水平・垂直・対角）から、焦点距離とピンホール径を求めます。",

        modeEqTitle: "35mm換算焦点距離から設計",
        modeEqDesc: "35mm換算の焦点距離から、同じ対角画角になるように設計します。",

        modeFocalTitle: "焦点距離から設計",
        modeFocalDesc: "ピンホール〜像面距離を直接指定して、最適なピンホール径と画角を求めます。",

        modeHoleTitle: "ピンホール径から設計",
        modeHoleDesc: "すでに開いている穴の大きさから、最適な焦点距離と画角を求めます。",

        fovDir: "画角の向き",
        fovVal: "目標画角 θ（度）",
        diag: "対角画角",
        horz: "水平画角",
        vert: "垂直画角",
        eq35: "35mm換算 焦点距離 f<sub>eq</sub>（mm）",
        focal: "焦点距離 f（mm）",
        hole: "ピンホール径 d（mm）",
        btnCalc: "計算",
        placeholder: "ここに設計結果が表示されます。",

        errCommon: "フィルムサイズと波長 λ を正しく入力してください（すべて正の数）。",
        errMode: "計算モードを選択してください。",
        errFov: "画角 θ は 0〜179度の範囲で入力してください。",
        errEq: "35mm換算焦点距離 f_eq を正しく入力してください（正の数）。",
        errFocal: "焦点距離 f を正しく入力してください（正の数）。",
        errHole: "ピンホール径 d を正しく入力してください（正の数）。",

        chipFormat: "フォーマット",
        chipLambda: "波長",
        chipMode: "モード",
        designTitle: "設計結果",
        anglesTitle: "この設計での画角",

        labelFocus: "焦点距離",
        labelHole: "ピンホール径",
        labelF: "F値（目安）",
        labelEq35: "35mm換算焦点距離",

        subFocus: "ピンホール〜像面距離",
        subHole: "Wikipedia の r²/λ の最適条件",
        subF: "露出計算のときはこの F値として扱う",
        subEq35: "フルサイズ35mmと同等の対角画角",

        angH: "水平",
        angV: "垂直",
        angD: "対角",
        subAngH: "横幅 W に対する画角",
        subAngV: "縦幅 H に対する画角",
        subAngD: "対角長に対する画角",

        modeLabelFov: "画角から設計",
        modeLabelEq: "35mm換算から設計",
        modeLabelFocal: "焦点距離から設計",
        modeLabelHole: "ピンホール径から設計",

        modeDetailFov: function (oriWord, theta) {
          return "指定した " + oriWord + "画角 θ = " + theta.toFixed(1) + "° を満たすように設計しました。";
        },
        modeDetailEq: function (fEq) {
          return "35mm換算 " + fEq.toFixed(1) + "mm と同じ対角画角になるように設計しました。";
        },
        modeDetailFocal: function (f) {
          return "指定した焦点距離 f = " + f.toFixed(1) + "mm に対して最適なピンホール径と画角を求めました。";
        },
        modeDetailHole: function (d) {
          return "指定したピンホール径 d = " + d.toFixed(3) + "mm に対して最適な焦点距離と画角を求めました。";
        },

        oriWords: { diagonal: "対角", horizontal: "水平", vertical: "垂直" },
        notesShow: "計算の中身を見る",
        notesHide: "計算の中身を隠す"
      },

      en: {
        title: "Pinhole Camera Calculator",
        subtitle: "Design angle of view, focal length, pinhole size, and 35mm equivalent",
        legendCommon: "Common parameters",
        legendMode: "Calculation mode",
        width: "Film / paper width W (mm)",
        height: "Film / paper height H (mm)",
        lambda: "Wavelength λ (nm)",

        modeFovTitle: "Design from angle of view",
        modeFovDesc: "Choose a desired angle of view to compute focal length and pinhole size.",

        modeEqTitle: "Design from 35mm equivalent focal length",
        modeEqDesc: "Use a 35mm equivalent focal length to match the same diagonal field of view.",

        modeFocalTitle: "Design from focal length",
        modeFocalDesc: "Enter the distance from pinhole to image plane directly, then compute pinhole size and field of view.",

        modeHoleTitle: "Design from pinhole size",
        modeHoleDesc: "Start from an existing pinhole diameter and compute the optimal focal length and field of view.",

        fovDir: "Angle direction",
        fovVal: "Target AoV θ (deg)",
        diag: "Diagonal AoV",
        horz: "Horizontal AoV",
        vert: "Vertical AoV",
        eq35: "35mm equiv. focal length f<sub>eq</sub> (mm)",
        focal: "Focal length f (mm)",
        hole: "Pinhole diameter d (mm)",
        btnCalc: "Calculate",
        placeholder: "The design result will be shown here.",

        errCommon: "Please enter positive values for film size and wavelength λ.",
        errMode: "Please select a calculation mode.",
        errFov: "Angle θ must be between 0 and 179 degrees.",
        errEq: "Please enter a valid 35mm equivalent focal length f_eq.",
        errFocal: "Please enter a valid focal length f.",
        errHole: "Please enter a valid pinhole diameter d.",

        chipFormat: "Format",
        chipLambda: "Wavelength",
        chipMode: "Mode",
        designTitle: "Design result",
        anglesTitle: "Angles with this design",

        labelFocus: "Focal length",
        labelHole: "Pinhole diameter",
        labelF: "F-number",
        labelEq35: "35mm equiv. focal length",

        subFocus: "Distance from pinhole to image plane",
        subHole: "Diffraction optimum d = 2√(fλ)",
        subF: "Use this N as the f-number for exposure",
        subEq35: "Diagonal field of view equivalent to full-frame",

        angH: "Horizontal",
        angV: "Vertical",
        angD: "Diagonal",
        subAngH: "Angle along width W",
        subAngV: "Angle along height H",
        subAngD: "Angle along the diagonal",

        modeLabelFov: "From angle of view",
        modeLabelEq: "From 35mm equiv.",
        modeLabelFocal: "From focal length",
        modeLabelHole: "From pinhole size",

        modeDetailFov: function (oriWord, theta) {
          return "Designed to match " + oriWord + " angle θ = " + theta.toFixed(1) + "°.";
        },
        modeDetailEq: function (fEq) {
          return "Designed to match the diagonal field of view of a " + fEq.toFixed(1) + " mm full-frame lens.";
        },
        modeDetailFocal: function (f) {
          return "Computed the optimal pinhole diameter and field of view for focal length f = " + f.toFixed(1) + " mm.";
        },
        modeDetailHole: function (d) {
          return "Computed the optimal focal length and field of view for pinhole diameter d = " + d.toFixed(3) + " mm.";
        },

        oriWords: { diagonal: "diagonal", horizontal: "horizontal", vertical: "vertical" },
        notesShow: "Show calculation details",
        notesHide: "Hide calculation details"
      }
    };

    function $(id) {
      return document.getElementById(id);
    }

    function safeSetText(id, value) {
      var el = $(id);
      if (el) el.textContent = value;
    }

    function safeSetHTML(id, value) {
      var el = $(id);
      if (el) el.innerHTML = value;
    }

    function getMode() {
      var radios = document.getElementsByName("mode");
      for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) return radios[i].value;
      }
      return null;
    }

    function updateModeVisibility() {
      var mode = getMode();

      $("modeFovBlock").style.display = mode === "fov" ? "block" : "none";
      $("modeEq35Block").style.display = mode === "eq35" ? "block" : "none";
      $("modeFocalBlock").style.display = mode === "focal" ? "block" : "none";
      $("modeHoleBlock").style.display = mode === "hole" ? "block" : "none";

      var cards = document.getElementsByClassName("mode-card");
      for (var i = 0; i < cards.length; i++) {
        var cardMode = cards[i].getAttribute("data-mode");
        if (cardMode === mode) {
          cards[i].classList.add("active");
        } else {
          cards[i].classList.remove("active");
        }
      }
    }

    function renderPlaceholder(messageKey) {
      $("result").innerHTML =
        '<div class="placeholder-text" id="placeholder">' +
        (uiText[currentLang][messageKey] || "") +
        "</div>";
    }

    function calcPinhole() {
      var text = uiText[currentLang];

      var widthMm = parseFloat($("widthMm").value);
      var heightMm = parseFloat($("heightMm").value);
      var lambdaNm = parseFloat($("lambdaNm").value);

      if (!(widthMm > 0 && heightMm > 0 && lambdaNm > 0)) {
        hasCalculated = false;
        renderPlaceholder("errCommon");
        return;
      }

      var mode = getMode();
      if (!mode) {
        hasCalculated = false;
        renderPlaceholder("errMode");
        return;
      }

      var lambdaMm = lambdaNm * 1e-6;
      var diagMm = Math.sqrt(widthMm * widthMm + heightMm * heightMm);

      var fMm, dMm, fNumber, thetaH, thetaV, thetaD;
      var fovType = null;
      var fovDeg = null;
      var fEqMm = null;
      var focalMm = null;
      var holeMm = null;

      if (mode === "fov") {
        fovType = $("fovType").value;
        fovDeg = parseFloat($("fovDeg").value);

        if (!(fovDeg > 0 && fovDeg < 179)) {
          hasCalculated = false;
          renderPlaceholder("errFov");
          return;
        }

        var L;
        if (fovType === "horizontal") L = widthMm;
        else if (fovType === "vertical") L = heightMm;
        else L = diagMm;

        var thetaRad = (fovDeg * Math.PI) / 180.0;
        fMm = (L / 2.0) / Math.tan(thetaRad / 2.0);

      } else if (mode === "eq35") {
        fEqMm = parseFloat($("fEqMm").value);

        if (!(fEqMm > 0)) {
          hasCalculated = false;
          renderPlaceholder("errEq");
          return;
        }

        fMm = fEqMm * (diagMm / DIAG_35MM);

      } else if (mode === "focal") {
        focalMm = parseFloat($("focalMm").value);

        if (!(focalMm > 0)) {
          hasCalculated = false;
          renderPlaceholder("errFocal");
          return;
        }

        fMm = focalMm;

      } else if (mode === "hole") {
        holeMm = parseFloat($("holeMm").value);

        if (!(holeMm > 0)) {
          hasCalculated = false;
          renderPlaceholder("errHole");
          return;
        }

        var rMm = holeMm / 2.0;
        fMm = (rMm * rMm) / lambdaMm;
      }

      if (mode === "hole") {
        dMm = holeMm;
      } else {
        dMm = 2.0 * Math.sqrt(fMm * lambdaMm);
      }

      fNumber = fMm / dMm;

      thetaH = (2 * Math.atan(widthMm / (2 * fMm)) * 180.0) / Math.PI;
      thetaV = (2 * Math.atan(heightMm / (2 * fMm)) * 180.0) / Math.PI;
      thetaD = (2 * Math.atan(diagMm / (2 * fMm)) * 180.0) / Math.PI;

      var fEqOut = fMm * (DIAG_35MM / diagMm);

      var formatText =
        "W " +
        widthMm.toFixed(1) +
        " mm × H " +
        heightMm.toFixed(1) +
        " mm (" +
        (currentLang === "ja" ? "対角 " : "diag ") +
        diagMm.toFixed(1) +
        " mm)";

      var modeLabel;
      var modeDetail;

      if (mode === "fov") {
        modeLabel = text.modeLabelFov;
        modeDetail = text.modeDetailFov(text.oriWords[fovType], fovDeg);
      } else if (mode === "eq35") {
        modeLabel = text.modeLabelEq;
        modeDetail = text.modeDetailEq(fEqMm);
      } else if (mode === "focal") {
        modeLabel = text.modeLabelFocal;
        modeDetail = text.modeDetailFocal(focalMm);
      } else {
        modeLabel = text.modeLabelHole;
        modeDetail = text.modeDetailHole(holeMm);
      }

      var html = "";
      html += '<div class="result-section">';
      html += '  <div class="result-chips">';
      html +=
        '    <span class="chip"><span class="label">' +
        text.chipFormat +
        "</span>" +
        formatText +
        "</span>";
      html +=
        '    <span class="chip"><span class="label">' +
        text.chipLambda +
        "</span>λ = " +
        lambdaNm.toFixed(0) +
        " nm</span>";
      html +=
        '    <span class="chip"><span class="label">' +
        text.chipMode +
        "</span>" +
        modeLabel +
        "</span>";
      html += "  </div>";

      html += '  <p class="mode-detail">' + modeDetail + "</p>";

      html += '  <div class="section-title">' + text.designTitle + "</div>";
      html += '  <div class="result-grid">';

      html += '    <div class="result-card main">';
      html += '      <div class="result-label">' + text.labelFocus + "</div>";
      html +=
        '      <div class="result-value">' +
        fMm.toFixed(2) +
        '<span class="unit">mm</span></div>';
      html += '      <div class="result-sub">' + text.subFocus + "</div>";
      html += "    </div>";

      html += '    <div class="result-card">';
      html += '      <div class="result-label">' + text.labelHole + "</div>";
      html +=
        '      <div class="result-value">' +
        dMm.toFixed(3) +
        '<span class="unit">mm</span></div>';
      html += '      <div class="result-sub">' + text.subHole + "</div>";
      html += "    </div>";

      html += '    <div class="result-card">';
      html += '      <div class="result-label">' + text.labelF + "</div>";
      html +=
        '      <div class="result-value">F/' +
        fNumber.toFixed(0) +
        "</div>";
      html += '      <div class="result-sub">' + text.subF + "</div>";
      html += "    </div>";

      html += '    <div class="result-card">';
      html += '      <div class="result-label">' + text.labelEq35 + "</div>";
      html +=
        '      <div class="result-value">' +
        fEqOut.toFixed(1) +
        '<span class="unit">mm</span></div>';
      html += '      <div class="result-sub">' + text.subEq35 + "</div>";
      html += "    </div>";

      html += "  </div>";

      html += '  <div class="section-title">' + text.anglesTitle + "</div>";
      html += '  <div class="result-grid">';

      html += '    <div class="result-card">';
      html += '      <div class="angle-badge">' + text.angH + "</div>";
      html +=
        '      <div class="result-value">' +
        thetaH.toFixed(1) +
        '<span class="unit">°</span></div>';
      html += '      <div class="result-sub">' + text.subAngH + "</div>";
      html += "    </div>";

      html += '    <div class="result-card">';
      html += '      <div class="angle-badge">' + text.angV + "</div>";
      html +=
        '      <div class="result-value">' +
        thetaV.toFixed(1) +
        '<span class="unit">°</span></div>';
      html += '      <div class="result-sub">' + text.subAngV + "</div>";
      html += "    </div>";

      html += '    <div class="result-card">';
      html += '      <div class="angle-badge">' + text.angD + "</div>";
      html +=
        '      <div class="result-value">' +
        thetaD.toFixed(1) +
        '<span class="unit">°</span></div>';
      html += '      <div class="result-sub">' + text.subAngD + "</div>";
      html += "    </div>";

      html += "  </div>";
      html += "</div>";

      $("result").innerHTML = html;
      hasCalculated = true;
    }

    function updateNotesVisibility() {
      var text = uiText[currentLang];

      $("notes-content").style.display = notesOpen ? "block" : "none";
      $("toggle-notes").textContent = notesOpen ? text.notesHide : text.notesShow;

      if (currentLang === "ja") {
        $("notes-ja").style.display = "block";
        $("notes-en").style.display = "none";
      } else {
        $("notes-ja").style.display = "none";
        $("notes-en").style.display = "block";
      }

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    function applyLanguage(lang) {
      currentLang = lang === "en" ? "en" : "ja";
      document.documentElement.lang = currentLang;

      var text = uiText[currentLang];

      safeSetText("title", text.title);
      safeSetText("subtitle", text.subtitle);
      safeSetText("legend-common", text.legendCommon);
      safeSetText("legend-mode", text.legendMode);

      safeSetText("label-width", text.width);
      safeSetText("label-height", text.height);
      safeSetText("label-lambda", text.lambda);

      safeSetText("mode-fov-title", text.modeFovTitle);
      safeSetText("mode-fov-desc", text.modeFovDesc);

      safeSetText("mode-eq-title", text.modeEqTitle);
      safeSetText("mode-eq-desc", text.modeEqDesc);

      safeSetText("mode-focal-title", text.modeFocalTitle);
      safeSetText("mode-focal-desc", text.modeFocalDesc);

      safeSetText("mode-hole-title", text.modeHoleTitle);
      safeSetText("mode-hole-desc", text.modeHoleDesc);

      safeSetText("label-fov-dir", text.fovDir);
      safeSetText("label-fov-val", text.fovVal);

      safeSetText("opt-diagonal", text.diag);
      safeSetText("opt-horizontal", text.horz);
      safeSetText("opt-vertical", text.vert);

      safeSetHTML("label-eq35", text.eq35);
      safeSetText("label-focal", text.focal);
      safeSetText("label-hole", text.hole);

      safeSetText("calcBtn", text.btnCalc);

      if (hasCalculated) {
        calcPinhole();
      } else {
        renderPlaceholder("placeholder");
      }

      if (currentLang === "ja") {
        $("btn-ja").classList.add("active");
        $("btn-en").classList.remove("active");
      } else {
        $("btn-en").classList.add("active");
        $("btn-ja").classList.remove("active");
      }

      updateNotesVisibility();
    }

    $("btn-ja").addEventListener("click", function () {
      applyLanguage("ja");
    });

    $("btn-en").addEventListener("click", function () {
      applyLanguage("en");
    });

    var cards = document.getElementsByClassName("mode-card");
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener("click", function () {
        var radio = this.querySelector('input[type="radio"]');
        if (radio) {
          radio.checked = true;
          updateModeVisibility();
        }
      });
    }

    $("calcBtn").addEventListener("click", calcPinhole);

    $("toggle-notes").addEventListener("click", function () {
      notesOpen = !notesOpen;
      updateNotesVisibility();
    });

    applyLanguage("ja");
    updateModeVisibility();
  })();
</script>
